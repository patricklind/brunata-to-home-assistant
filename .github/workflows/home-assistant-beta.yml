name: Home Assistant beta compatibility

on:
  workflow_call:
  pull_request:
  push:
    branches: [main, master]
    paths:
      - custom_components/**
      - beta_tests/**
      - .github/workflows/home-assistant-beta.yml

permissions:
  contents: read

jobs:
  beta:
    name: Home Assistant 2026.11.0b1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
      - name: Install the exact beta core
        run: python -m pip install homeassistant==2026.11.0b1
      - name: Verify beta core API compatibility
        run: python -m unittest discover -s beta_tests -v
