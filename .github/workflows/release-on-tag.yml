name: Release from tag

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  quality:
    name: Tests and static checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - name: Install validation tools and runtime requirements
        run: |
          pip install --constraint=.github/workflows/constraints.txt pip pre-commit black flake8 reorder-python-imports
          pip install --requirement requirements.txt
      - name: Run pre-commit
        run: pre-commit run --config .github/pre-commit.yml --all-files --show-diff-on-failure --color=always
      - name: Run Python tests
        run: python -m unittest discover -s tests -v
      - name: Run frontend tests
        run: node --test tests/*.test.mjs

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Validate HACS integration
        uses: hacs/action@22.5.0
        with:
          category: integration

  hassfest:
    name: Hassfest validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Run Hassfest
        uses: home-assistant/actions/hassfest@master

  publish_release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [quality, hacs, hassfest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Verify tag matches integration version
        shell: python
        run: |
          import json
          import os

          with open(
              "custom_components/brunata_online/manifest.json", encoding="utf-8"
          ) as manifest_file:
              version = json.load(manifest_file)["version"]

          tag = os.environ["GITHUB_REF_NAME"]
          expected_tag = f"v{version}"
          if tag != expected_tag:
              raise SystemExit(
                  f"Release tag {tag!r} does not match manifest version "
                  f"{version!r}; expected {expected_tag!r}."
              )

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3.0.2
        with:
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
