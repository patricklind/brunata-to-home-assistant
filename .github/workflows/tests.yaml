name: Linting

on:
  pull_request:
  push:
    branches:
      - main
      - master
    paths:
      - "custom_components/**"
      - ".github/workflows/**"
      - ".github/workflows/constraints.txt"
      - ".github/pre-commit.yml"
      - "hacs.json"
      - "requirements.txt"
      - "requirements_test.txt"
      - "README.md"
      - "fetch_brunata_data.py"
      - "tests/**"

env:
  DEFAULT_PYTHON: 3.12

concurrency:
  group: linting-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: "ubuntu-latest"
    name: Pre-commit
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python ${{ env.DEFAULT_PYTHON }}
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}

      - name: Upgrade pip
        run: |
          pip install --constraint=.github/workflows/constraints.txt pip
          pip --version

      - name: Install Python modules
        run: |
          pip install --constraint=.github/workflows/constraints.txt pre-commit black flake8 reorder-python-imports

      - name: Run pre-commit on all files
        run: |
          pre-commit run --config .github/pre-commit.yml --all-files --show-diff-on-failure --color=always

  hacs:
    runs-on: "ubuntu-latest"
    name: HACS
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1

      - name: HACS validation
        uses: hacs/action@22.5.0
        with:
          category: "integration"

  hassfest:
    runs-on: "ubuntu-latest"
    name: Hassfest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1

      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master

  tests:
    runs-on: "ubuntu-latest"
    name: Unit tests
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
      - name: Set up Python ${{ env.DEFAULT_PYTHON }}
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
      - name: Install requirements
        run: pip install --requirement requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  frontend-tests:
    runs-on: "ubuntu-latest"
    name: Frontend tests
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - name: Run frontend tests
        run: node --test tests/*.test.mjs

  home-assistant-tests:
    runs-on: "ubuntu-latest"
    name: Home Assistant runtime tests
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
      - name: Set up Python 3.12
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Install Home Assistant test harness
        run: pip install --requirement requirements_test.txt
      - name: Run Home Assistant runtime tests
        run: pytest -q ha_tests
